# Construit l'image DevisMaker et la publie sur GitHub Container Registry (ghcr.io/epwo/devismaker).
# L'image est rattachée à ce dépôt : privée comme lui, accessible à ses collaborateurs.
#   - à chaque tag vX.Y.Z  : tags X.Y.Z, X.Y et latest
#   - à la demande (onglet Actions → Run workflow) : tag du nom de la branche + sha
name: Image Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Architectures (linux/amd64 seule = build 3x plus rapide, image 2x plus petite)"
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/epwo/devismaker

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      # 1. Essai sur amd64 avant toute publication : l'image démarre et /health répond
      - name: Build de test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: devismaker:test
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Essai de démarrage
        run: |
          docker run -d --name devis -p 8000:8000 devismaker:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs devis; exit 1

      # 2. Build multi-architecture et publication
      - name: Publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          {
            echo "### Image publiée"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Tester : \`docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}\` (après \`docker login ghcr.io\`)"
          } >> "$GITHUB_STEP_SUMMARY"
